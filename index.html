</head>

const hexName = h => { const n = parseInt(h.slice(1),16), r = n>>16, g = (n>>8)&255, b = n&255;
  return HEXN.map(([x,nm]) => { const m = parseInt(x.slice(1),16); return [(r-(m>>16))**2+(g-((m>>8)&255))**2+(b-(m&255))**2, nm]; }).sort((a,b)=>a[0]-b[0])[0][1]; };
const normColor = c => typeof c == "string" ? {name: ok6(c) ? hexName(c) : c, img:""} : {name:c.name||"", img:c.img||""};
const norm = p => ({...p, colors:(p.colors||[]).map(normColor), sizes:p.sizes||[]});
const cname = (p,k) => (p.colors[k] && p.colors[k].name) || (p.colors.length ? "لون " + (+k+1) : "");
const cimg = (p,k) => (p.colors[k] && p.colors[k].img) || img(p);
products = products0.map(norm);

/* ===== تطبيق الإعدادات على الصفحة ===== */
const link = (u, base) => !u ? "" : /^https?:\/\//i.test(u) ? u : base + u.replace(/^@/,"");
function applyCfg(){
  const s = cfg, B = s.brand, R = t => String(t||"").replace(/\{brand\}/g, B);
  FREE_SHIP = +s.freeShip || 0; HOME_PRICE = +s.homePrice || 0; POST_PRICE = +s.postPrice || 0;
  const c = ok6(s.color) ? s.color : DEF.color, c2 = ok6(s.color2) ? s.color2 : DEF.color2, st = document.documentElement.style;
  st.setProperty("--c", c); st.setProperty("--c2", c2); st.setProperty("--c3", mix(c,.22));
  const v = s.ver ? "?v=" + s.ver : "";
  st.setProperty("--hero", `url(0.jpg${v})`); st.setProperty("--bgimg", `url(a.jpg${v})`);
  document.title = B + " | " + (R(s.shopTitle) || "");
  $("brand").textContent = B; $("mbrand").textContent = B;
  $("hh").textContent = s.heroTitle; $("hs").textContent = s.heroSub; $("hb").textContent = s.heroBtn;
  $("shopt").textContent = s.shopTitle;
  $("ann").style.display = s.ann ? "" : "none"; $("ann").textContent = s.ann;
  $("closedbar").style.display = s.closed ? "" : "none"; $("closedbar").textContent = s.closedMsg;
  const F = s.features; $("why").style.display = $("mw").style.display = F.show && F.items.length ? "" : "none";
  $("whyt").textContent = R(F.title);
  $("feat").innerHTML = F.items.map(x => `<div><b>${esc(x.icon)}</b>${esc(x.title)}<br><small>${esc(x.sub)}</small></div>`).join("");
  const V = s.reviews; $("rev").style.display = $("mr").style.display = V.show && V.items.length ? "" : "none";
  $("revt").textContent = R(V.title);
  $("revbox").innerHTML = V.items.map(x => `<div>⭐⭐⭐⭐⭐<p>${esc(x.text)}</p><small>— ${esc(x.name)}</small></div>`).join("");
  const Q = s.faq; $("faq").style.display = $("mf").style.display = Q.show && Q.items.length ? "" : "none";
  $("faqt").textContent = R(Q.title);
  $("faqbox").innerHTML = Q.items.map(x => `<details><summary>${esc(x.q)}</summary><p>${esc(x.a).replace(/\n/g,"<br>")}</p></details>`).join("");
  const S = s.social, wn = String(S.whatsapp||"").replace(/\D/g,"");
  const L = [
    [link(S.instagram,"https://instagram.com/"), "📷 Instagram"], [link(S.facebook,"https://facebook.com/"), "📘 Facebook"],
    [S.tiktok ? link(S.tiktok,"https://tiktok.com/@") : "", "🎵 TikTok"],
    [wn ? "https://wa.me/" + wn : "", "💬 WhatsApp"],
    [S.phone ? "tel:" + String(S.phone).replace(/\s/g,"") : "", "📞 " + esc(S.phone)], [S.email ? "mailto:" + S.email : "", "✉️ " + esc(S.email)]
  ].filter(x => x[0]);
  $("soc").innerHTML = L.map(([h,t]) => `<a href="${esc(h)}" target="_blank" rel="noopener">${t}</a>`).join("");
  $("ft").textContent = R(s.footer);
  $("wa").style.display = wn ? "grid" : "none"; $("wa").href = wn ? "https://wa.me/" + wn : "#";
  dlOpts();
}

/* ===== بيانات المتجر: تُقرأ من products.json (تُعدَّل من admin.html) ===== */
function clean(){ if(PREVIEW) return; Object.keys(basket).forEach(k=>{if(!byId(k.split("|")[0])) delete basket[k]}); favs=favs.filter(id=>byId(id)); save();}
function setData(d){
  cfg = mergeCfg(d.settings);
  products = (d.products||[]).filter(p=>p.show!==false).map(norm);
  applyCfg(); clean(); render(); draw(); drawFav();
}
async function loadData(){
  try{
    const d = await (await fetch("products.json?t="+Date.now())).json();
    if((d.products||[]).length || d.settings){
      localStorage.pj = JSON.stringify(d); setData(d);
    }
  }catch(e){}
}

/* ===== المتجر ===== */
function render(){
  const cats = ["الكل", ...new Set(products.map(p => p.cat).filter(Boolean))];
  if(!cats.includes(cat)) cat = "الكل";
  $("cats").innerHTML = cats.map(c => `<button class="ib ${c==cat?'on':''}" onclick="cat=this.dataset.c;render()" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("mcats").innerHTML = cats.filter(c=>c!="الكل").map(c=>`<a class="sub" href="#shop" data-c="${esc(c)}" onclick="cat=this.dataset.c;render();closeP()">• ${esc(c)}</a>`).join("");
  let l = products.filter(p => (cat=="الكل"||p.cat==cat) && (p.name||"").includes($("q").value.trim()));
  const so = $("sort").value;
  if(so=="a") l.sort((a,b)=>a.price-b.price);
  else if(so=="d") l.sort((a,b)=>b.price-a.price);
  else if(so=="az") l.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  else if(so=="new") l.sort((a,b)=>b.id-a.id);
  $("list").innerHTML = l.map(p => `
    <div class="card ${p.soldout?"so":""}">
      ${p.old?`<span class="tag">-${Math.round(100-p.price/p.old*100)}%</span>`:""}
      ${p.badge?`<span class="tag b">${esc(p.badge)}</span>`:""}
      ${p.soldout?`<span class="sold">نفذت الكمية</span>`:""}
      <button class="heart" onclick="fav(${p.id})">${favs.includes(p.id)?"❤️":"🤍"}</button>
      <div class="im"><img src="${esc(img(p))}" alt="${esc(p.name)}" loading="lazy" ${ERR} onclick="openPg(${p.id})"></div>
      <div class="i"><b>${esc(p.name)}</b><small style="color:var(--m)">${esc(p.cat)}</small>
        <div><span class="p">${p.price} دج</span>${p.old?`<span class="old">${p.old}</span>`:""}</div>
        <button class="btn" ${p.soldout?"disabled":""} onclick="openPg(${p.id})">${p.soldout?"غير متوفر":"طلب"}</button></div></div>`).join("") || "<p>لا توجد نتائج 😕</p>";
  $("fn").textContent = favs.length;
}
function fav(id){favs = favs.includes(id) ? favs.filter(x=>x!=id) : [...favs,id]; save(); render(); drawFav();}
function save(){ if(PREVIEW) return; localStorage.basket=JSON.stringify(basket); localStorage.favs=JSON.stringify(favs);}

/* ===== نموذج بيانات الزبونة (مشترك بين السلة وصفحة الطلب) ===== */
const WOPT = '<option value="">اختاري الولاية</option>' + WILAYAS.map((w,i)=>`<option value="${i+1}">${String(i+1).padStart(2,"0")} - ${w}</option>`).join("");
const custForm = (pf, extra="") => `
  <input id="${pf}nm" placeholder="الاسم الكامل" required>
  <input id="${pf}ph" placeholder="رقم الهاتف (مثال: 0555123456)" type="tel" inputmode="numeric" pattern="0[567][0-9]{8}" title="رقم جزائري صحيح من 10 أرقام" required>
  <label>نوع التوصيل</label>
  <select id="${pf}dv" class="dvsel" onchange="draw()"><option value="home"></option><option value="post"></option></select>
  <label>الولاية</label>
  <select id="${pf}wl" onchange="loadBal('${pf}');draw()" required>${WOPT}</select>
  <label>البلدية</label>
  <select id="${pf}bl" required><option value="">اختاري البلدية</option></select>
  <input id="${pf}bl2" placeholder="اكتبي اسم البلدية" style="display:none">
  ${extra}
  <input id="${pf}ad" placeholder="العنوان بالتفصيل" required>
  <textarea id="${pf}nt" placeholder="📝 ملاحظة أو معلومة خاصة (اختياري)"></textarea>`;
function dlOpts(){document.querySelectorAll(".dvsel").forEach(s=>{
  const w = $(s.id.slice(0,-2)+"wl"), wv = w ? w.value : "", h = price("home",wv), p = price("post",wv);
  s.options[0].text = cfg.homeLabel + (h ? " — " + fmt(h) : "");
  s.options[1].text = cfg.postLabel + (p ? " — " + fmt(p) : "");});}

async function getCommunes(){
  if(communes) return communes;
  try{
    const c = sessionStorage.communes;
    if(c) return communes = JSON.parse(c);
    const r = await fetch(COMMUNES_URL), data = await r.json(), m = {};
    data.forEach(x => (m[+x.wilaya_code] ||= []).push(x.commune_name || x.commune_name_ascii));
    for(const k in m) m[k] = [...new Set(m[k])].sort((a,b)=>a.localeCompare(b,"ar"));
    try{sessionStorage.communes = JSON.stringify(m)}catch(e){}
    return communes = m;
  }catch(e){ return communes = {}; }
}
async function loadBal(pf){
  const w = $(pf+"wl").value, s = $(pf+"bl"), m = $(pf+"bl2");
  s.style.display = ""; s.required = true; m.style.display = "none"; m.required = false;
  s.innerHTML = '<option value="">' + (w ? "جاري التحميل..." : "اختاري البلدية") + '</option>';
  if(!w) return;
  const list = (await getCommunes())[w];
  const manual = !list || !list.length;          // لو تعذّر التحميل: كتابة يدوية
  s.style.display = manual ? "none" : ""; s.required = !manual;
  m.style.display = manual ? "" : "none"; m.required = manual;
  s.innerHTML = '<option value="">اختاري البلدية</option>' + (list||[]).map(b=>`<option>${esc(b)}</option>`).join("");
}

/* ===== السلة ===== */
function add(id,q=1){
  if(cfg.closed) return toast(cfg.closedMsg);
  const p=byId(id); if(!p || p.soldout) return toast("نفذت الكمية");
  const sz=p.sizes&&p.sizes.length?p.sizes[psz[id]??0]:"", k=id+"|"+(pick[id]??0)+"|"+sz; basket[k]=(basket[k]||0)+q; save(); draw(); toast("تمت الإضافة للسلة ✅");}
function chg(k,d){basket[k]+=d; if(basket[k]<=0) delete basket[k]; save(); draw();}
function draw(){
  let t=0,n=0;
  $("items").innerHTML = Object.entries(basket).map(([k,q])=>{const [id,ci,sz]=k.split("|"), p=byId(id); if(!p) return ""; t+=p.price*q; n+=q;
    return `<div class="row"><img src="${esc(cimg(p,ci))}" ${ERR}><span>${esc(p.name)}<br><small>${[cname(p,ci), sz].filter(Boolean).map(esc).join(" • ")}${cname(p,ci)||sz?" • ":""}${p.price*q} دج</small></span>
      <div class="q"><button onclick="chg('${k}',1)">+</button> ${q} <button onclick="chg('${k}',-1)">−</button></div></div>`}).join("") || "السلة فارغة";
  const fee = feeOf(t, $("cdv").value, $("cwl").value);
  $("sub").textContent=t; $("fee").textContent = fee ? fmt(fee) : (t ? "مجاني 🎉" : "0 دج");
  $("total").textContent=t+fee; $("n").textContent=n;
  $("free").textContent = !FREE_SHIP ? "" : t>=FREE_SHIP ? "🎉 توصيل مجاني لطلبك!" : `أضيفي ${FREE_SHIP-t} دج للحصول على توصيل مجاني`;
  $("free").style.display = FREE_SHIP ? "" : "none";
  dlOpts(); updPg();
}
function drawFav(){$("favs").innerHTML = favs.map(id=>byId(id)?`<div class="row"><img src="${esc(img(byId(id)))}" ${ERR}><span>${esc(byId(id).name)}</span>
  <button class="ib" onclick="openPg(${id});closeP()">طلب</button></div>`:"").join("") || "لا توجد مفضلات";}

/* ===== صفحة الطلب للمنتج ===== */
function openPg(id){
  const p = byId(id); if(!p) return;
  if(p.soldout) return toast("نفذت الكمية");
  cur = id; pq = 1; pick[id] ??= 0; psz[id] ??= 0;
  const sizeSel = p.sizes && p.sizes.length ? `<label>المقاس</label><select id="osz" onchange="psz[${id}]=this.selectedIndex">${p.sizes.map((z,k)=>`<option ${psz[id]==k?"selected":""}>${esc(z)}</option>`).join("")}</select>` : "";
  if(pick[id] >= p.colors.length) pick[id] = 0;
  const colors = p.colors.length ? `<label>اللون</label><select id="ocl" onchange="pickC(${id},this.selectedIndex)">${p.colors.map((c,k)=>`<option ${pick[id]==k?"selected":""}>${esc(cname(p,k))}</option>`).join("")}</select>` : "";
  const qc = `<div class="qc"><button type="button" onclick="qty(1)">+</button><span class="oq">1</span><button type="button" onclick="qty(-1)">−</button></div>`;
  $("pg").innerHTML = `
    <div class="pgh"><button class="ib" onclick="closePg()">→ رجوع</button><b>${esc(p.name)}</b></div>
    <div class="pgb">
      <img class="pimg" id="pimg" src="${esc(cimg(p,pick[id]))}" alt="${esc(p.name)}" ${ERR}>
      <div class="i" style="padding:0"><h2>${esc(p.name)}</h2>
        <div><span class="p">${p.price} دج</span>${p.old?`<span class="old">${p.old}</span>`:""}</div>
        <p style="color:var(--m)">${esc(p.desc||"").replace(/\n/g,"<br>")}</p></div>
      <form id="pform" class="ocard" onsubmit="orderNow(event)">
        <h3>لإتمام الطلب يرجى إدخال المعلومات التالية :</h3>
        ${custForm("o", sizeSel + colors)}
        <div class="sumbox">سعر التوصيل : <b id="ofee"></b><br>الثمن الإجمالي : <b id="otot"></b></div>
        <div class="orow" id="orow">${qc}<button class="btn big pob">أطلب الآن</button></div>
        <button type="button" class="btn grn" onclick="add(cur,pq)">أضف إلى السلة</button>
      </form>
    </div>
    <div class="stk" id="stk">${qc}<button class="btn big pob" form="pform">أطلب الآن</button></div>`;
  $("pg").classList.add("open"); $("pg").scrollTop = 0; document.body.style.overflow = "hidden";
  dlOpts(); updPg();
  io && io.disconnect();
  io = new IntersectionObserver(([e]) => $("stk").classList.toggle("show", !e.isIntersecting), {root:$("pg")});
  io.observe($("orow"));
}
function closePg(){$("pg").classList.remove("open"); document.body.style.overflow=""; cur=0; io && io.disconnect();}
function pickC(id,k){pick[id]=k; const p=byId(id), im=$("pimg"); if(p&&im){ im.onerror=function(){this.onerror=null;this.src=PH}; im.src=cimg(p,k); }}
function qty(d){pq = Math.max(1, pq+d); updPg();}
function updPg(){
  if(!cur || !$("otot")) return;
  const p = byId(cur); if(!p) return;
  const t = p.price*pq, fee = feeOf(t, $("odv").value, $("owl").value);
  $("ofee").textContent = fee ? fmt(fee) : "مجاني 🎉"; $("otot").textContent = fmt(t+fee);
  document.querySelectorAll(".oq").forEach(e => e.textContent = pq);
}

/* ===== إرسال الطلب إلى البريد ===== */
async function send(pf, en, btns, ok){
  if(cfg.closed) return toast(cfg.closedMsg);
  if(PREVIEW) return toast("هذه معاينة فقط، لا يتم إرسال الطلب");
  const g = id => $(pf+id), t = en.reduce((s,[k,q]) => s + byId(k.split("|")[0]).price*q, 0), dv = g("dv").value, fee = feeOf(t,dv,g("wl").value);
  const data = {
    _subject: "طلب جديد - " + cfg.brand,
    name: g("nm").value, phone: g("ph").value,
    wilaya: g("wl").selectedOptions[0].text.replace(/^\d+ - /,""),
    baladiya: g("bl").value || g("bl2").value,
    address: g("ad").value,
    products: en.map(([k,q])=>{const [id,ci,sz]=k.split("|"), p=byId(id); const cn = cname(p,ci); return `${p.name}${cn||sz?" (":""}${cn?"اللون: "+cn:""}${cn&&sz?" - ":""}${sz?"المقاس: "+sz:""}${cn||sz?")":""} × ${q}`}).join(" | "),
    delivery: dv=="post" ? cfg.postLabel : cfg.homeLabel,
    delivery_fee: fee ? fmt(fee) : "مجاني", subtotal: fmt(t),
    note: g("nt").value || "—", total: fmt(t+fee)
  };
  btns.forEach(b=>{b.disabled=true; b.dataset.t=b.textContent; b.textContent="جاري الإرسال..."});
  try{
    const r = await fetch(FORM_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
    if(!r.ok) throw 0;
    ok(); toast(cfg.okMsg);
  }catch(err){ toast("❌ تعذّر الإرسال، حاولي مرة أخرى"); }
  btns.forEach(b=>{b.disabled=false; b.textContent=b.dataset.t});
}
function order(e){e.preventDefault();
  const en = Object.entries(basket);
  if(!en.length) return toast("السلة فارغة!");
  send("c", en, [$("sb")], ()=>{basket={}; save(); $("oform").reset(); loadBal("c"); draw(); closeP();});
}
function orderNow(e){e.preventDefault();
  const p = byId(cur), k = cur+"|"+(pick[cur]??0)+"|"+(p.sizes&&p.sizes.length ? p.sizes[psz[cur]??0] : "");
  send("o", [[k,pq]], [...document.querySelectorAll(".pob")], closePg);
}

function openP(id){closeP(); $(id).classList.add("open"); $("ov").style.display="block";}
function closeP(){document.querySelectorAll(".panel").forEach(p=>p.classList.remove("open")); $("ov").style.display="none";}
function toast(m){const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500);}
function toggleDark(){document.body.classList.toggle("dark"); if(!PREVIEW) localStorage.dark = document.body.classList.contains("dark")?1:"";}
addEventListener("keydown", e => { if(e.key=="Escape"){ closePg(); closeP(); } });

/* ===== التشغيل ===== */
if(localStorage.dark && !PREVIEW) document.body.classList.add("dark");
$("cf").innerHTML = custForm("c");
if(PREVIEW){
  /* المعاينة: تستقبل البيانات من لوحة التحكم مباشرة */
  addEventListener("message", e => { if(e.origin===location.origin && e.data && e.data.type=="preview") setData(e.data.data); });
  cfg = mergeCfg({}); applyCfg(); render(); draw(); drawFav();
  parent.postMessage({type:"ready"}, location.origin);
}else{
  try{const c=JSON.parse(localStorage.pj||"null"); if(c){ cfg = mergeCfg(c.settings); products = (c.products||[]).filter(p=>p.show!==false).map(norm);} }catch(e){}
  applyCfg(); clean(); render(); draw(); drawFav(); loadData();
}
</script>
</body>
</html>
